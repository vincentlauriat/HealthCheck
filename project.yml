name: HealthCheck
options:
  bundleIdPrefix: fr.vincentlauriat
  deploymentTarget:
    macOS: "15.0"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0

schemes:
  HealthCheck:
    build:
      targets:
        HealthCheck: all
    test:
      targets:
        - HealthCheckTests
    run:
      config: Debug
  HealthCheckCompanion:
    build:
      targets:
        HealthCheckCompanion: all
    test:
      targets:
        - HealthCheckCompanionTests
    run:
      config: Debug

targets:
  HealthCheck:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: HealthCheck
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
      - path: HealthCheckShared
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_NAME: HealthCheck
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.healthcheck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_ENTITLEMENTS: HealthCheck/HealthCheck.entitlements
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: HealthCheck/Info.plist
      properties:
        CFBundleDevelopmentRegion: fr
        CFBundleName: HealthCheck
        CFBundleDisplayName: HealthCheck
        CFBundleIdentifier: fr.vincentlauriat.healthcheck
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""

  HealthCheckTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: HealthCheckTests
    resources:
      - path: HealthCheckTests/Fixtures
    dependencies:
      - target: HealthCheck
    settings:
      base:
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  HealthCheckCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Companion
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
      - path: HealthCheckShared
    settings:
      base:
        PRODUCT_NAME: HealthCheckCompanion
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.healthcheck.companion
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: KFLACS69T9
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Companion/Companion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Companion/Info.plist
      properties:
        CFBundleName: HealthCheck Companion
        CFBundleDisplayName: HealthCheck Companion
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: "HealthCheck Companion lit vos données Santé (activité, cœur, sommeil, séances) pour les synchroniser vers HealthCheck sur votre Mac, via votre réseau local uniquement."
        NSLocalNetworkUsageDescription: "HealthCheck Companion recherche votre Mac sur le réseau local pour lui envoyer vos données de santé, sans aucun cloud."
        NSBonjourServices: ["_healthcheck._tcp"]

  HealthCheckCompanionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CompanionTests
    dependencies:
      - target: HealthCheckCompanion
    settings:
      base:
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
